name: vortex

services:
  # Vanilla server matching the protocol version Vortex targets.
  # Compression is ON (vanilla default threshold 256) - this is the realistic
  # target every earlier project failed against.
  mc:
    image: itzg/minecraft-server:latest
    container_name: vortex-mc
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-VANILLA}"
      VERSION: "${MC_VERSION:-1.21.1}"
      MEMORY: "2G"
      ONLINE_MODE: "false"
      NETWORK_COMPRESSION_THRESHOLD: "${MC_COMPRESSION:-256}"
      # An ordinary overworld: trees, stone, ores and hills, which is what the
      # bot has to cope with. Fixed seed so that a world regenerated later looks
      # the same and tests keep their landmarks.
      LEVEL_TYPE: "minecraft:normal"
      SEED: "vortex"
      GENERATE_STRUCTURES: "false"
      SPAWN_MONSTERS: "false"
      SPAWN_ANIMALS: "false"
      SPAWN_NPCS: "false"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "10"
      MOTD: "Vortex test server"
      OVERRIDE_SERVER_PROPERTIES: "true"
    volumes:
      - mc-data:/data
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 2m
      interval: 10s
      retries: 20

  # Same server with compression disabled, for isolating whether a bug is in
  # the compression path or elsewhere. Started only via: --profile nocompression
  mc-nocompression:
    extends: mc
    container_name: vortex-mc-nocompression
    profiles: ["nocompression"]
    ports:
      - "25566:25565"
    environment:
      NETWORK_COMPRESSION_THRESHOLD: "-1"
      MOTD: "Vortex test server (no compression)"
    volumes:
      - mc-data-nocompression:/data

volumes:
  mc-data:
  mc-data-nocompression:
